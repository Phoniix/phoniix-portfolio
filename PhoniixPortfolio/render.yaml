services:
  - type: web
    name: phoniix-portfolio
    buildCommand: |
      # Make Maven wrapper executable
      chmod +x mvnw
      # Build the application using Maven wrapper
      ./mvnw clean package -DskipTests
    startCommand: java -jar target/PhoniixPortfolio-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /actuator/health
