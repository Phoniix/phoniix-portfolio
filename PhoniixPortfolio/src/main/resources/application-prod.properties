# Production Configuration for Render.com
spring.application.name=PhoniixPortfolio

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Logging Configuration - Production Level
logging.level.com.Phoniix.PhoniixPortfolio=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.root=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Logging File Configuration
logging.file.name=/app/logs/portfolio.log
logging.file.max-size=10MB
logging.file.max-history=30

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Production Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Static Resource Caching
spring.web.resources.cache.cachecontrol.max-age=1y
spring.web.resources.cache.cachecontrol.cache-private=false
spring.web.resources.cache.cachecontrol.cache-public=true

# Error Handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
