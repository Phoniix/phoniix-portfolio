services:
  - type: web
    name: phoniix-portfolio
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/PhoniixPortfolio-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /actuator/health
